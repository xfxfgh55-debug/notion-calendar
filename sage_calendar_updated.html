<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sage Calendar</title><style>
:root{--sage:#748f7c;--cell:#bfc5bf;--ink:#202d27;--line:#849b89;--cream:#f4f5f1}*{box-sizing:border-box}body{margin:0;background:var(--sage);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--cream)}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1550px;margin:auto;padding:25px 27px 38px}.eyebrow{font:500 17px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;opacity:.95;display:flex;gap:10px;align-items:center}.top{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:24px}.heading{font:650 clamp(28px,3.5vw,44px) -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:8px 0 0}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-left:auto}.nav-controls{display:flex;gap:8px;align-items:center;margin-left:18px}.pill{border:1px solid #d4e1d6a8;background:#ffffff15;color:white;border-radius:30px;padding:9px 14px}.pill:hover{background:#ffffff2b}.primary{background:#e4ebe3;color:#304b3a;border:0;font-weight:700}.weekdays,.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}.weekdays{text-align:center;margin-bottom:8px;font-size:12px;letter-spacing:1.4px;font-weight:700}.weekdays>div{padding:8px}.month{display:flex;flex-direction:column;gap:5px}.week{position:relative;gap:5px;min-height:124px}.day{background:var(--cell);border-radius:12px;min-width:0;min-height:124px;padding:9px 11px;color:var(--ink);position:relative;cursor:pointer;transition:background .15s}.day:hover{background:#d0d6d0}.day.outside{opacity:.48}.day.today{outline:none}.num{font-weight:650;font-size:15px}.day.today .num{background:#426b50;color:#fff;border-radius:50%;width:29px;height:29px;display:inline-flex;align-items:center;justify-content:center;margin:-5px 0 0 -6px;padding:0;font-weight:700}.week-events{position:absolute;inset:0;pointer-events:none}.event{position:absolute;height:23px;border-radius:14px;display:flex;align-items:center;padding:0 9px;white-space:no x;flex-wrap:wrap}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#203c2b;color:white;padding:9px 16px;border-radius:12px;display:none;z-index:200;font-size:12px}@media(max-width:760px){.shell{padding:15px 8px}.top{align-items:start;flex-direction:column}.heading{font-size:34px}.eyebrow{font-size:18px}.week{gap:2px;min-height:105px}.day{min-height:105px;border-radius:6px;padding:5px 4px}.num{font-size:12px}.event{font-size:9px;padding:0 4px;height:19px}.weekdays{font-size:10px}.footer{padding:0 6px}.two{grid-template-columns:1fr}}

/* Compact Apple Calendar inspired event editor */
.overlay{background:#0a1413a6;align-items:center;justify-content:center}.apple-modal{width:min(440px,calc(100vw - 28px));background:#222927;color:#f4f5f3;border:1px solid #6c7771;border-radius:27px;padding:18px;box-shadow:0 24px 70px #09130dbb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.modal-top{display:flex;justify-content:space-between;align-items:center;color:#d9dfda;font-size:13px;margin:0 0 12px}.close-x{border:0;border-radius:50%;background:#3d4742;color:#e9ede9;width:27px;height:27px;font-size:20px;line-height:1}.event-kind{background:#46534c;border-radius:16px;text-align:center;font-size:14px;font-weight:700;padding:11px;margin-bottom:12px}.apple-card{background:#303936;border-radius:18px;margin-bottom:12px;padding:8px 15px}.apple-card input,.apple-card textarea{color:#f4f5f3;background:transparent;border:0;outline:0;width:100%;padding:12px 0;border-radius:0;font-size:15px}.apple-card input::placeholder,.apple-card textarea::placeholder{color:#a4aea7}.title-row{display:flex;align-items:center;gap:12px;border-bottom:1px solid #526059}.title-row #eventTitle{font-size:20px;font-weight:650;min-width:0}.category-trigger{border:0;background:#46524b;border-radius:12px;padding:7px 9px;display:flex;align-items:center;gap:7px;cursor:pointer;flex-shrink:0}.color-circle{display:block;width:25px;height:25px;border-radius:50%;background:#a9c2ae}.chevron{font-size:18px;color:#e5ebe5}.category-popover{background:#2c3531;border:1px solid #56645a;border-radius:18px;padding:13px;margin:-4px 0 12px;box-shadow:0 10px 28px #0005}.category-popover[hidden],#categoryEditor[hidden]{display:none}.category-popover-title{display:flex;justify-content:space-between;align-items:center;color:#a9b7ae;font-weight:650;margin:0 4px 8px;font-size:13px}.category-popover-title button,.new-category{background:transparent;color:#c7d8ca;border:0;padding:7px;cursor:pointer}.category-option{display:flex;align-items:center;gap:12px;width:100%;border:0;border-radius:11px;background:transparent;color:#f1f4f0;text-align:left;padding:10px 12px;font-size:15px;cursor:pointer}.category-option:hover,.category-option.active{background:#3e4a42}.category-option .color-circle{width:21px;height:21px;flex-shrink:0}.category-option .tick{margin-left:auto;color:#b9d3bd}.new-category{width:100%;text-align:left;border-top:1px solid #465249;margin-top:5px}.category-edit-btn{margin-left:auto;color:#c6d1c8;background:#536258;border:0;border-radius:7px;padding:5px 8px;cursor:pointer}#categoryEditor{border-top:1px solid #56645a;padding-top:12px;margin-top:8px}#categoryName{background:#3a463e;color:white;border:1px solid #68786b;border-radius:8px;padding:9px;width:100%;margin-bottom:10px}.category-color-label{display:flex;align-items:center;justify-content:space-between;font-size:13px}.category-color-label input{width:40px;height:36px;border:0;background:transparent}.category-editor-actions{display:flex;gap:7px;justify-content:flex-end;margin-top:10px}.category-editor-actions button{border:0;border-radius:9px;padding:8px 12px;background:#4c5b50;color:white;cursor:pointer}.category-editor-actions #removeCategory{margin-right:auto;color:#ffb4b4;background:transparent}.category-editor-actions #saveCategory{background:#8cad93;color:#18281c;font-weight:700}.date-card label{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;border-bottom:1px solid #526059}.date-card label:last-child{border:0}.date-card input[type=datetime-local]{width:220px;max-width:65%;text-align:right;font-size:13px;color-scheme:dark}.date-card .all-day input{width:20px;height:20px;accent-color:#7da68a}.apple-card textarea{resize:vertical;min-height:62px}.apple-actions{margin-top:13px}.apple-actions .action{background:#46524a;color:#f4f5f3;border:0;border-radius:13px;padding:10px 16px}.apple-actions .save{background:#729a7b;color:#12281b;font-weight:750}.apple-actions .danger{background:transparent;color:#ff9797}.event{border-radius:13px}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}

/* Compact toolbar: add on the left, navigation on the right */
.heading-group{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.heading-group .heading{margin:0}
.controls{margin-left:auto}
.nav-controls{margin-left:0}
#add{font-size:12px;padding:7px 12px}
.nav-controls .pill{font-size:12px;padding:7px 11px;min-height:30px}
@media(max-width:760px){.top{flex-direction:row;align-items:center;flex-wrap:wrap}.heading-group{gap:9px}.heading{font-size:26px}.controls{margin-left:auto}.nav-controls{gap:4px}#add{font-size:11px;padding:6px 9px}.nav-controls .pill{font-size:11px;padding:6px 8px}}
</style></head><body><div class="shell"><div class="top"><div class="heading-group"><h1 class="heading" id="monthLabel"></h1><button class="pill primary" id="add">＋ Add Event</button></div><div class="controls"><span class="nav-controls"><button class="pill" id="prev" aria-label="Previous month">‹</button><button class="pill" id="today">Today</button><button class="pill" id="next" aria-label="Next month">›</button></span></div></div><div class="weekdays"><div>SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div></div><div class="month" id="month"></div><p class="muted">Click any date to add an event · Click an event to edit · Changes save in this browser only</p></div>
<div class="overlay" id="eventOverlay"><div class="modal apple-modal" role="dialog" aria-modal="true" aria-label="Event editor"><form id="eventForm"><div class="modal-top"><span id="modalTitle">New Event</span><button type="button" class="close-x" data-close aria-label="Close">×</button></div><div class="event-kind">Event</div><div class="apple-card"><div class="title-row"><input id="eventTitle" required maxlength="120" placeholder="New Event" aria-label="Event title"><button type="button" id="categoryTrigger" class="category-trigger" aria-label="Choose calendar and color"><span id="chosenColor" class="color-circle"></span><span class="chevron">⌄</span></button></div><input id="location" maxlength="180" placeholder="Add location or video call" aria-label="Location"></div><div class="category-popover" id="categoryPopover" hidden><div class="category-popover-title">Calendars <button type="button" id="manageCategories">Edit</button></div><div id="categoryOptions"></div><button type="button" id="addCategory" class="new-category">＋ New calendar</button><div id="categoryEditor" hidden><input id="categoryName" placeholder="Calendar name" maxlength="40"><label class="category-color-label">Color <input id="categoryColor" type="color" value="#a9c2ae"></label><div class="category-editor-actions"><button type="button" id="removeCategory">Delete</button><button type="button" id="cancelCategory">Cancel</button><button type="button" id="saveCategory">Save</button></div></div></div><div class="apple-card date-card"><label>Starts<input id="start" type="datetime-local" required></label><label>Ends<input id="end" type="datetime-local" required></label><label class="all-day"><span>All-day event</span><input id="allDay" type="checkbox" checked></label></div><div class="apple-card"><textarea id="notes" rows="2" placeholder="Add notes, URL, or details" aria-label="Notes"></textarea></div><div class="actions apple-actions"><button type="button" class="action danger" id="delete" hidden>Delete</button><button type="button" class="action" data-close>Cancel</button><button type="submit" class="action save">Save</button></div></form></div></div><div class="toast" id="toast"></div>
<script>
(()=>{'use strict';const KEY='sage-planner-v1';const defaults=[{id:'school',name:'Schedule',color:'#67b6d0'},{id:'exam',name:'Study',color:'#9da8b6'},{id:'personal',name:'Personal',color:'#c49a79'},{id:'holiday',name:'Holiday',color:'#c5a6cf'},{id:'trip',name:'Travel',color:'#e4bd54'}];let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch{}if(!data||!Array.isArray(data.events)||!Array.isArray(data.categories))data={events:[],categories:defaults};if(!data.categories.length)data.categories=defaults;const now=new Date();let year=now.getFullYear(),month=now.getMonth(),editing=null,selectedCategory='school',categoryEditId=null,managingCategories=false;const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0'),key=(y,m,d)=>`${y}-${pad(m+1)}-${pad(d)}`,dateObj=s=>new Date(s+'T12:00:00'),daysBetween=(a,b)=>Math.round((dateObj(b)-dateObj(a))/86400000),safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch{alert('Storage is full. Please export a backup.')}};function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2200)}function category(id){return data.categories.find(c=>c.id===id)||data.categories[0]||{color:'#a9c2ae',name:'Other'}}function textColor(hex){const h=hex.replace('#','');if(h.length!==6)return '#17251b';const rgb=[0,2,4].map(i=>parseInt(h.slice(i,i+2),16));return rgb.reduce((s,v,i)=>s+v*[.299,.587,.114][i],0)<145?'#ffffff':'#24332a'}
function render(){const first=new Date(year,month,1),start=new Date(year,month,1-first.getDay()),last=new Date(year,month+1,0),weeks=Math.ceil((first.getDay()+last.getDate())/7);$('monthLabel').textContent=first.toLocaleString('en-US',{month:'long',year:'numeric'});$('month').innerHTML='';for(let w=0;w<weeks;w++){const row=document.createElement('div');row.className='week';let weekDates=[];for(let d=0;d<7;d++){const dt=new Date(start.getFullYear(),start.getMonth(),start.getDate()+w*7+d),s=key(dt.getFullYear(),dt.getMonth(),dt.getDate());weekDates.push(s);const cell=document.createElement('div');cell.className='day'+(dt.getMonth()!==month?' outside':'')+(s===key(now.getFullYear(),now.getMonth(),now.getDate())?' today':'');cell.innerHTML=`<span class="num">${dt.getDate()}</span>`;cell.onclick=()=>openEvent(null,s);row.appendChild(cell)}const layer=document.createElement('div');layer.className='week-events';row.appendChild(layer);const segs=data.events.filter(e=>e.start<=weekDates[6]&&e.end>=weekDates[0]).map(e=>({e,left:Math.max(0,daysBetween(weekDates[0],e.start)),right:Math.min(6,daysBetween(weekDates[0],e.end))})).sort((a,b)=>a.left-b.left||b.right-a.right||a.e.title.localeCompare(b.e.title));const lanes=[];for(const seg of segs){let lane=lanes.findIndex(last=>last<seg.left);if(lane<0){lane=lanes.length;lanes.push(seg.right)}else lanes[lane]=seg.right;seg.lane=lane}const maxLane=Math.max(0,...segs.map(s=>s.lane));const rowHeight=Math.max(124,46+(maxLane+1)*27);row.style.minHeight=rowHeight+'px';for(const cell of row.querySelectorAll('.day'))cell.style.minHeight=rowHeight+'px';for(const seg of segs){const el=document.createElement('div'),cat=category(seg.e.category);el.className='event';el.style.left=`calc(${seg.left*100/7}% + ${seg.left*5/7+10}px)`;el.style.width=`calc(${(seg.right-seg.left+1)*100/7}% + ${(seg.right-seg.left+1)*5/7-17}px)`;el.style.top=(40+seg.lane*27)+'px';el.style.background=seg.e.color||cat.color;el.style.color=textColor(seg.e.color||cat.color);el.style.zIndex=String(2+seg.lane);el.title=`${seg.e.title} (${seg.e.start} – ${seg.e.end})`;el.textContent=(seg.left===0&&seg.e.start<weekDates[0]?'↪ ':'')+seg.e.title;el.onclick=ev=>{ev.stopPropagation();openEvent(seg.e)};layer.appendChild(el)}$('month').appendChild(row)} }
function openEvent(e,day){editing=e?.id||null;selectedCategory=e?.category||data.categories[0]?.id||'school';if(!data.categories.some(c=>c.id===selectedCategory))selectedCategory=data.categories[0]?.id||'school';$('categoryPopover').hidden=true;managingCategories=false;$('modalTitle').textContent=e?'Edit Event':'New Event';$('eventTitle').value=e?.title||'';const defaultDay=day||key(year,month,Math.min(now.getDate(),new Date(year,month+1,0).getDate()));$('start').value=(e?.start||defaultDay)+'T'+(e?.startTime||'09:00');$('end').value=(e?.end||defaultDay)+'T'+(e?.endTime||'10:00');updateChosenColor();$('location').value=e?.location||'';$('notes').value=e?.notes||'';$('allDay').checked=e?.allDay??true;$('delete').hidden=!e;$('eventOverlay').classList.add('open');$('eventTitle').focus()}
$('eventForm').onsubmit=ev=>{ev.preventDefault();const sv=$('start').value,evv=$('end').value,start=sv.slice(0,10),end=evv.slice(0,10);if(evv<sv){alert('End must be after start.');return}const entry={id:editing||((crypto.randomUUID&&crypto.randomUUID())||String(Date.now())+Math.random()),title:$('eventTitle').value.trim(),start,end,startTime:sv.slice(11),endTime:evv.slice(11),allDay:$('allDay').checked,category:selectedCategory,color:category(selectedCategory).color,location:$('location').value,notes:$('notes').value};if(!entry.title)return;if(editing){data.events=data.events.map(e=>e.id===editing?entry:e)}else data.events.push(entry);save();$('eventOverlay').classList.remove('open');const dt=dateObj(start);year=dt.getFullYear();month=dt.getMonth();render();toast('Event saved')};$('delete').onclick=()=>{if(editing&&confirm('Delete this event?')){data.events=data.events.filter(e=>e.id!==editing);save();$('eventOverlay').classList.remove('open');render();toast('Event deleted')}};
function updateChosenColor(){$('chosenColor').style.background=category(selectedCategory).color}function showCategories(){const host=$('categoryOptions');host.innerHTML='';for(const c of data.categories){const b=document.createElement('div');b.setAttribute('role','button');b.tabIndex=0;b.className='category-option'+(selectedCategory===c.id?' active':'');const dot=document.createElement('span');dot.className='color-circle';dot.style.background=c.color;const name=document.createElement('span');name.textContent=c.name;b.append(dot,name);if(managingCategories){const edit=document.createElement('button');edit.type='button';edit.className='category-edit-btn';edit.textContent='Edit';edit.onclick=ev=>{ev.stopPropagation();editCategory(c.id)};b.append(edit)}else if(selectedCategory===c.id){const tick=document.createElement('span');tick.className='tick';tick.textContent='✓';b.append(tick)}b.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();b.click()}};b.onclick=()=>{if(managingCategories){editCategory(c.id);return}selectedCategory=c.id;updateChosenColor();$('categoryPopover').hidden=true};host.append(b)}$('manageCategories').textContent=managingCategories?'Done':'Edit'}function editCategory(id){categoryEditId=id;const c=data.categories.find(x=>x.id===id);$('categoryName').value=c?.name||'';$('categoryColor').value=c?.color||'#a9c2ae';$('removeCategory').hidden=!id;$('categoryEditor').hidden=false;$('categoryName').focus()}$('categoryTrigger').onclick=()=>{$('categoryPopover').hidden=!$('categoryPopover').hidden;if(!$('categoryPopover').hidden){managingCategories=false;$('categoryEditor').hidden=true;showCategories()}};$('manageCategories').onclick=()=>{managingCategories=!managingCategories;$('categoryEditor').hidden=true;showCategories()};$('addCategory').onclick=()=>editCategory(null);$('cancelCategory').onclick=()=>{$('categoryEditor').hidden=true};$('saveCategory').onclick=()=>{const name=$('categoryName').value.trim();if(!name)return alert('Enter a calendar name.');const color=$('categoryColor').value;if(categoryEditId){const c=data.categories.find(x=>x.id===categoryEditId);if(c){c.name=name;c.color=color;data.events.filter(e=>e.category===c.id).forEach(e=>e.color=color)}}else{const id='cat-'+Date.now()+'-'+Math.random().toString(36).slice(2,6);data.categories.push({id,name,color});selectedCategory=id}save();updateChosenColor();$('categoryEditor').hidden=true;showCategories();render()};$('removeCategory').onclick=()=>{if(data.categories.length<2)return alert('Keep at least one calendar.');if(!confirm('Delete this calendar? Its events will move to the first calendar.'))return;const id=categoryEditId;const replacement=data.categories.find(c=>c.id!==id);data.events.forEach(e=>{if(e.category===id){e.category=replacement.id;e.color=replacement.color}});data.categories=data.categories.filter(c=>c.id!==id);if(selectedCategory===id)selectedCategory=replacement.id;save();updateChosenColor();$('categoryEditor').hidden=true;showCategories();render()};$('prev').onclick=()=>{month--;if(month<0){month=11;year--}render()};$('next').onclick=()=>{month++;if(month>11){month=0;year++}render()};$('today').onclick=()=>{year=now.getFullYear();month=now.getMonth();render()};$('add').onclick=()=>openEvent();document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('.overlay').classList.remove('open'));document.querySelectorAll('.overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)o.classList.remove('open')}));document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.overlay').forEach(o=>o.classList.remove('open'))});render();})();
</script></body></html>
